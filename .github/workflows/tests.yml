name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dataset
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Tesseract
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Unit tests (Verhoeff, validators, generator invariants)
        run: make test
      - name: Smoke build (6 persons, end to end)
        run: |
          PYTHONPATH=src python3 -m idforge.build --out data/smoke --n-persons 6 --workers 2
          PYTHONPATH=src python3 -m idforge.report --out data/smoke
